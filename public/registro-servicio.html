<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienestar en Casa - Registrar Servicio</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; margin-top: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; background-color: #f4f4f4; padding: 10px 20px; margin-bottom: 20px; }
        .error { color: red; font-size: 0.9em; display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Catálogo de Servicios</h2>
        <a href="/dashboard.html">Volver al Dashboard</a>
    </div>

    <h3>Registrar un Nuevo Servicio</h3>
    <p>Completa la información para añadir el servicio a tu catálogo.</p>

    <form id="formRegistroServicio">
        <div class="form-group">
            <label for="serv-nombre">Nombre del Servicio:</label>
            <input type="text" id="serv-nombre" required>
        </div>
        
        <div class="form-group">
            <label for="serv-categoria">Categoría (Restringida por R-02):</label>
            <select id="serv-categoria" required>
                <option value="">Seleccione una categoría...</option>
                <option value="Estética">Estética</option>
                <option value="Bienestar">Bienestar</option>
                <option value="Masajes">Masajes</option>
            </select>
        </div>

        <div class="form-group">
            <label for="serv-descripcion">Descripción:</label>
            <textarea id="serv-descripcion" rows="3" required></textarea>
        </div>

        <div class="form-group">
            <label for="serv-duracion">Duración Estimada (en minutos):</label>
            <input type="number" id="serv-duracion" min="1" required>
        </div>

        <div class="form-group">
            <label for="serv-precio">Precio:</label>
            <input type="number" id="serv-precio" step="0.01" min="0" required>
        </div>

        <div class="form-group">
            <label for="serv-estado">Estado Inicial:</label>
            <select id="serv-estado" required>
                <option value="A">Activo (Visible para clientes)</option>
                <option value="I">Inactivo (Oculto)</option>
            </select>
        </div>

        <p id="mensajeErrorServicio" class="error"></p>
        <button type="submit" id="btnRegistrarServicio">Guardar Servicio</button>
    </form>

    <!-- Puedes usar main.js o crear un script específico aquí -->
    <script src="servicios.js"></script>
</body>
</html>
