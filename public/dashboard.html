<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Principal - Bienestar en Casa</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background-color: #f4f4f4; padding: 10px 20px; }
        .btn-logout { padding: 8px 15px; background-color: #dc3545; color: white; border: none; cursor: pointer; }
        .content { margin-top: 20px; padding: 20px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Hola, <span id="nombreUsuario">Usuario</span></h2>
        <button id="btnCerrarSesion" class="btn-logout">Cerrar Sesión</button>
    </div>

    <div class="content">
        <h3>Tu Perfil de <span id="rolUsuario">...</span></h3>
        <p>Este es tu panel de control. Aquí se cargarán dinámicamente tus servicios o solicitudes basándonos en tu rol.</p>
        
        <!-- Aquí conectaremos el GET del perfil más adelante -->
        <button id="btnVerPerfil" style="padding: 10px; margin-top: 10px;">Probar carga de Perfil Seguro</button>
        <pre id="datosPerfil" style="background: #eee; padding: 10px; margin-top: 10px; display: none;"></pre>
        
        <p style="text-align: center; margin-top: 20px;">
        <a href="registro-servicio.html">Registrar un servicio </a>
        </p>
        <p style="text-align: center; margin-top: 20px;">
        <a href="registro-zona.html">Registrar una zona </a>
        </p>
    </div>

    <script src="main.js"></script>
</body>
</html>
