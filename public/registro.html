<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Bienestar en Casa</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        .extra-fields { display: none; } /* Se muestran según el rol */
    </style>
</head>
<body>
    <h2>Crear Cuenta</h2>
    <form id="formRegistro">
        <div class="form-group">
            <label for="reg-nombre">Nombre:</label>
            <input type="text" id="reg-nombre" required>
        </div>
        <div class="form-group">
            <label for="reg-apellido">Apellido:</label>
            <input type="text" id="reg-apellido" required>
        </div>
        <div class="form-group">
            <label for="reg-correo">Correo Electrónico:</label>
            <input type="email" id="reg-correo" required>
        </div>
        <div class="form-group">
            <label for="reg-contrasena">Contraseña:</label>
            <input type="password" id="reg-contrasena" required minlength="6">
        </div>
        <div class="form-group">
            <label for="reg-rol">Tipo de Usuario:</label>
            <select id="reg-rol" required>
                <option value="">Seleccione un rol...</option>
                <option value="C">Cliente</option>
                <option value="P">Proveedor</option>
            </select>
        </div>

        <!-- Campos dinámicos según el rol -->
        <div id="campo-cliente" class="form-group extra-fields">
            <label for="reg-direccion">Dirección Principal:</label>
            <input type="text" id="reg-direccion">
        </div>
        <div id="campo-proveedor" class="form-group extra-fields">
            <label for="reg-descripcion">Descripción Profesional:</label>
            <input type="text" id="reg-descripcion">
        </div>

        <button type="submit" id="btnRegistro">Registrarse</button>
    </form>
    <p style="text-align: center;"><a href="/index.html">Volver al Login</a></p>

    <script src="main.js"></script>
</body>
</html>
