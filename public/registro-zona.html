<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienestar en Casa - Registrar Zona de Atención</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #17a2b8; color: white; border: none; cursor: pointer; margin-top: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; background-color: #f4f4f4; padding: 10px 20px; margin-bottom: 20px; }
        .error { color: red; font-size: 0.9em; display: none; margin-top: 10px; }
        .success { color: green; font-size: 0.9em; display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Zonas de Atención</h2>
        <a href="/dashboard.html">Volver</a>
    </div>

    <h3>Añadir Nueva Zona</h3>
    <p>Ingresa la ciudad y el barrio o sector donde prestas tus servicios de forma orientativa.</p>

    <form id="formRegistroZona">
        <div class="form-group">
            <label for="zona-ciudad">Ciudad:</label>
            <input type="text" id="zona-ciudad" required placeholder="Ej. Cali">
        </div>
        
        <div class="form-group">
            <label for="zona-barrio">Barrio o Sector:</label>
            <input type="text" id="zona-barrio" required placeholder="Ej. El Ingenio, Sur">
        </div>

        <p id="mensajeErrorZona" class="error"></p>
        <p id="mensajeExitoZona" class="success"></p>
        <button type="submit" id="btnRegistrarZona">Guardar Zona</button>
    </form>

    <script src="zonas.js"></script>
</body>
</html>
