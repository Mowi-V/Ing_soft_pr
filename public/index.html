<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienestar en Casa - Iniciar Sesión</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 8px; margin-top: 5px; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; cursor: pointer; }
        .error { color: red; font-size: 0.9em; display: none; }
    </style>
</head>
<body>
    <h2>Bienestar en Casa</h2>
    <p>Inicia sesión para gestionar tus servicios.</p>

    <form id="formLogin">
        <div class="form-group">
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" required>
        </div>
        <div class="form-group">
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" required>
        </div>
        <p id="mensajeError" class="error">Credenciales incorrectas.</p>
        <button type="submit" id="btnLogin">Entrar</button>
    </form>

    <p style="text-align: center; margin-top: 20px;">
        ¿No tienes cuenta? <a href="/registro.html">Regístrate aquí</a>
    </p>

    <script src="main.js"></script>
</body>
</html>
